<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Task Tracker</title>
  <meta name="description" content="A small task tracker built with Firebase and Google Cloud.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand">
        <h1>Cloud Task Tracker</h1>
        <p class="tagline">A Firebase and Google Cloud learning project</p>
      </div>

      <div class="progress-block">
        <p class="summary" id="summary">Loading tasks…</p>
        <div class="progress" aria-hidden="true">
          <span class="progress-seg seg-done" id="seg-done"></span>
          <span class="progress-seg seg-in-progress" id="seg-in-progress"></span>
          <span class="progress-seg seg-todo" id="seg-todo"></span>
        </div>
      </div>

      <nav class="status-filter" aria-label="Filter tasks by status">
        <button type="button" data-filter="all" aria-pressed="true">All <span data-count="all">0</span></button>
        <button type="button" data-filter="todo" aria-pressed="false">To do <span data-count="todo">0</span></button>
        <button type="button" data-filter="in-progress" aria-pressed="false">In progress <span data-count="in-progress">0</span></button>
        <button type="button" data-filter="done" aria-pressed="false">Done <span data-count="done">0</span></button>
      </nav>
    </div>
  </header>

  <main class="layout">
    <section class="composer" aria-labelledby="form-heading">
      <h2 id="form-heading">Add a task</h2>
      <form id="task-form" novalidate>
        <div class="field">
          <label for="title">Title</label>
          <input id="title" name="title" type="text" maxlength="100" autocomplete="off" required
                 aria-describedby="title-error">
          <p class="field-error" id="title-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="description">Description <span class="optional">(optional)</span></label>
          <textarea id="description" name="description" rows="4" maxlength="500"
                    aria-describedby="desc-count"></textarea>
          <p class="field-hint" id="desc-count">0 / 500</p>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">Add task</button>
          <button type="button" class="btn btn-quiet" id="cancel-btn" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="tasks" aria-labelledby="list-heading">
      <div class="tasks-head">
        <h2 id="list-heading">Tasks</h2>
        <input type="search" id="search" placeholder="Search by title" aria-label="Search tasks by title">
      </div>

      <p class="loading" id="loading">Loading tasks…</p>
      <ul class="task-list" id="task-list"></ul>

      <div class="empty" id="empty-state" hidden>
        <p id="empty-text"></p>
        <button type="button" class="btn btn-quiet" id="clear-filters" hidden>Clear search and filter</button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="site-footer">
    <p>Demo data only. Built with Firebase Hosting and Cloud Firestore.</p>
  </footer>
</body>
</html>
